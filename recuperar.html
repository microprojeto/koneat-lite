<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat Lite - Recuperar acesso</title>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100vh; height: 100dvh; margin: 0; padding: 0;
            background: #000000; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .app-screen {
            width: 100%; max-width: 390px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px) 24px;
        }
        .logo-area { text-align: center; margin-top: 16px; }
        .logo-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .logo-subtitle { font-size: 11px; letter-spacing: 2px; color: #8e8e93; margin-top: 4px; text-transform: uppercase; }
        
        .input-group { width: 100%; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 13px; font-weight: 500; color: #ffffff; }
        .input-wrapper {
            position: relative;
            width: 100%; height: 48px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            display: flex; align-items: center; padding: 0 16px;
        }
        .input-wrapper:focus-within { border-color: #ffffff; }
        .input-field { width: 100%; background: none; border: none; outline: none; color: #ffffff; font-size: 14px; }
        .input-field::placeholder { color: #8e8e93; }

        /* BOTÃO OLHO INSTAGRAM */
        .toggle-password {
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center; color: #8e8e93;
            transition: color 0.2s ease;
        }
        .toggle-password:hover, .toggle-password:active { color: #ffffff; }
        .toggle-password svg { width: 20px; height: 20px; }

        /* CAMPOS DO CÓDIGO DE 6 DÍGITOS */
        .otp-container { display: flex; gap: 8px; justify-content: center; margin: 20px 0; }
        .otp-input {
            width: 44px; height: 52px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px;
            text-align: center; font-size: 20px; font-weight: 700; color: #ffffff; outline: none;
        }
        .otp-input:focus { border-color: #ffffff; }

        .btn-submit {
            width: 100%; height: 48px; background: #ffffff; color: #000000;
            border: none; border-radius: 24px; font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .footer-link { color: #8e8e93; text-decoration: underline; text-underline-offset: 4px; font-size: 13px; text-align: center; cursor: pointer; display: block; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="app-screen">
        <div class="logo-area">
            <h1 class="logo-title">KONEAT LITE</h1>
            <div class="logo-subtitle" id="stepSubtitle">RECUPERAR ACESSO</div>
        </div>

        <!-- ETAPA 1: INFORMAR O E-MAIL -->
        <div id="step1Form" style="width: 100%;">
            <div class="input-group">
                <label class="input-label">E-mail da conta</label>
                <div class="input-wrapper">
                    <input type="email" id="emailField" class="input-field" placeholder="Digite seu e-mail" required autocomplete="email">
                </div>
            </div>

            <button type="button" class="btn-submit" id="btnGoToStep2">ENVIAR CÓDIGO</button>
        </div>

        <!-- ETAPA 2: VALIDAR CÓDIGO DE 6 DÍGITOS (ESCONDIDO INICIALMENTE) -->
        <div id="step2Form" style="width: 100%; display: none;">
            <p style="font-size: 13px; color: #8e8e93; text-align: center; margin-bottom: 10px;">
                Enviamos um código de 6 dígitos para o seu e-mail.
            </p>

            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
                <input type="text" maxlength="1" class="otp-input">
            </div>

            <button type="button" class="btn-submit" id="btnVerifyCode">VALIDAR CÓDIGO</button>
        </div>

        <!-- ETAPA 3: DEFINIR A NOVA SENHA (ESCONDIDO INICIALMENTE) -->
        <div id="step3Form" style="width: 100%; display: none;">
            <div class="input-group">
                <label class="input-label">Nova senha</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordField" class="input-field" placeholder="Digite a nova senha" required autocomplete="new-password">
                    <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Alternar senha">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="button" class="btn-submit" id="btnSavePassword">SALVAR NOVA SENHA</button>
        </div>

        <div>
            <a class="footer-link" onclick="window.location.href='index.html'">Voltar ao Login</a>
        </div>
    </div>

    <script>
        /* ===============================================================
           1. CLIENTE SUPABASE
           =============================================================== */
        const SUPABASE_URL = 'https://aerhvhowzteqezqvhtmg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N0XY12nN2CAdEmI4FCGSaA__y0NNKkO';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        /* ===============================================================
           2. ELEMENTOS
           =============================================================== */
        const step1Form = document.getElementById('step1Form');
        const step2Form = document.getElementById('step2Form');
        const step3Form = document.getElementById('step3Form');
        const stepSubtitle = document.getElementById('stepSubtitle');
        const emailField = document.getElementById('emailField');
        const passwordField = document.getElementById('passwordField');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const btnGoToStep2 = document.getElementById('btnGoToStep2');
        const btnVerifyCode = document.getElementById('btnVerifyCode');
        const btnSavePassword = document.getElementById('btnSavePassword');
        const otpInputs = Array.from(document.querySelectorAll('.otp-input'));

        /* ===============================================================
           3. ALTERNÂNCIA DO OLHO DO INSTAGRAM
           =============================================================== */
        const openEyeSVG = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
        const closedEyeSVG = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>`;

        togglePassBtn.addEventListener('click', () => {
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? closedEyeSVG : openEyeSVG;
        });

        /* ===============================================================
           4. NAVEGAÇÃO ENTRE ETAPAS
           =============================================================== */
        function irParaCodigo() {
            step1Form.style.display = 'none';
            step3Form.style.display = 'none';
            step2Form.style.display = 'block';
            stepSubtitle.innerText = 'CONFIRMAÇÃO';
            otpInputs[0].focus();
        }

        function irParaNovaSenha() {
            step1Form.style.display = 'none';
            step2Form.style.display = 'none';
            step3Form.style.display = 'block';
            stepSubtitle.innerText = 'NOVA SENHA';
            passwordField.focus();
        }

        function limparCodigo() {
            otpInputs.forEach(input => { input.value = ''; });
            otpInputs[0].focus();
        }

        function lerCodigo() {
            return otpInputs.map(input => input.value).join('');
        }

        /* ===============================================================
           5. CAIXAS DO CÓDIGO: SÓ NÚMEROS, COLAR, BACKSPACE E ENTER
           =============================================================== */
        otpInputs.forEach((input, index) => {
            input.setAttribute('inputmode', 'numeric');
            input.setAttribute('pattern', '[0-9]*');
            input.setAttribute('autocomplete', index === 0 ? 'one-time-code' : 'off');

            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '').slice(-1);
                if (input.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = '';
                }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnVerifyCode.click();
                }
            });

            input.addEventListener('paste', (e) => {
                const texto = (e.clipboardData || window.clipboardData).getData('text') || '';
                const digitos = texto.replace(/\D/g, '').slice(0, 6);
                if (!digitos) return;
                e.preventDefault();
                digitos.split('').forEach((digito, i) => {
                    if (otpInputs[i]) otpInputs[i].value = digito;
                });
                otpInputs[Math.min(digitos.length, otpInputs.length - 1)].focus();
            });
        });

        /* ===============================================================
           6. ETAPA 1 -> PEDE O CÓDIGO DE RECUPERAÇÃO
           =============================================================== */
        btnGoToStep2.addEventListener('click', async () => {
            const email = emailField.value.trim().toLowerCase();

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('Digite um e-mail válido.');
                return;
            }

            btnGoToStep2.disabled = true;

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email);

            btnGoToStep2.disabled = false;

            if (error) {
                alert('Erro ao enviar o código: ' + error.message);
                return;
            }

            irParaCodigo();
            alert('Se existir uma conta com este e-mail, enviamos um código de 6 dígitos.');
        });

        /* ===============================================================
           7. ETAPA 2 -> VALIDA O CÓDIGO (CRIA A SESSÃO DE RECUPERAÇÃO)
           =============================================================== */
        btnVerifyCode.addEventListener('click', async () => {
            const token = lerCodigo();
            const email = emailField.value.trim().toLowerCase();

            if (token.length !== 6) {
                alert('Digite os 6 dígitos do código!');
                return;
            }

            btnVerifyCode.disabled = true;

            const { data, error } = await supabaseClient.auth.verifyOtp({
                email: email,
                token: token,
                type: 'recovery'
            });

            btnVerifyCode.disabled = false;

            if (!error) {
                limparCodigo();
                irParaNovaSenha();
                return;
            }

            // Código expirado: pedimos um novo
            if (error.code === 'otp_expired' || /expired/i.test(error.message)) {
                await supabaseClient.auth.resetPasswordForEmail(email);
                limparCodigo();
                alert('O código expirou. Enviamos um novo código para o seu e-mail.');
                return;
            }

            limparCodigo();
            alert('Código inválido. Confira os 6 dígitos e tente novamente.');
        });

        /* ===============================================================
           8. ETAPA 3 -> GRAVA A NOVA SENHA
           =============================================================== */
        btnSavePassword.addEventListener('click', async () => {
            const novaSenha = passwordField.value;

            if (novaSenha.length < 6) {
                alert('A nova senha precisa ter no mínimo 6 caracteres.');
                return;
            }

            // Garante que a sessão de recuperação ainda está ativa
            const { data: sessao } = await supabaseClient.auth.getSession();
            if (!sessao || !sessao.session) {
                alert('A sua sessão de recuperação expirou. Comece de novo.');
                window.location.href = 'recuperar.html';
                return;
            }

            btnSavePassword.disabled = true;

            const { error } = await supabaseClient.auth.updateUser({ password: novaSenha });

            btnSavePassword.disabled = false;

            if (error) {
                alert('Não foi possível salvar a nova senha: ' + error.message);
                return;
            }

            await supabaseClient.auth.signOut();
            alert('Senha atualizada com sucesso! Entre com a sua nova senha.');
            window.location.href = 'index.html';
        });
    </script>
</body>
    </html>
