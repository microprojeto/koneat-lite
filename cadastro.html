<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat Lite - Cadastro</title>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100vh; height: 100dvh; margin: 0; padding: 0;
            background: #000000; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .app-screen {
            width: 100%; max-width: 390px; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px) 24px;
        }
        .logo-area { text-align: center; margin-top: 16px; }
        .logo-title { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin: 0; }
        .logo-subtitle { font-size: 11px; letter-spacing: 2px; color: #8e8e93; margin-top: 4px; text-transform: uppercase; }
        
        .input-group { width: 100%; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
        .input-label { font-size: 13px; font-weight: 500; color: #ffffff; }
        .input-wrapper {
            position: relative;
            width: 100%; height: 48px; background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            display: flex; align-items: center; padding: 0 16px;
        }
        .input-wrapper:focus-within { border-color: #ffffff; }
        .input-field { width: 100%; background: none; border: none; outline: none; color: #ffffff; font-size: 14px; }
        .input-field::placeholder { color: #8e8e93; }

        /* BOTÃO OLHO INSTAGRAM */
        .toggle-password {
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; justify-content: center; color: #8e8e93;
            transition: color 0.2s ease;
        }
        .toggle-password:hover, .toggle-password:active { color: #ffffff; }
        .toggle-password svg { width: 20px; height: 20px; }

        .btn-submit {
            width: 100%; height: 48px; background: #ffffff; color: #000000;
            border: none; border-radius: 24px; font-size: 15px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .footer-link { color: #8e8e93; text-decoration: underline; text-underline-offset: 4px; font-size: 13px; text-align: center; cursor: pointer; display: block; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="app-screen">
        <div class="logo-area">
            <h1 class="logo-title">KONEAT LITE</h1>
            <div class="logo-subtitle" id="stepSubtitle">CRIE SUA CONTA</div>
        </div>

        <!-- ETAPA 1: PREENCHER DADOS -->
        <div id="step1Form" style="width: 100%;">
            <div class="input-group">
                <label class="input-label">Nome de usuário</label>
                <div class="input-wrapper">
                    <input type="text" id="usernameField" class="input-field" placeholder="Digite seu @usuario" required autocomplete="username">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">E-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="emailField" class="input-field" placeholder="Digite seu e-mail" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="passwordField" class="input-field" placeholder="Digite sua senha" required autocomplete="new-password">
                    <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Alternar senha">
                        <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="button" class="btn-submit" id="btnGoToStep2">CONTINUAR</button>
        </div>

        <!-- ETAPA 2: CONFIRMAR O E-MAIL PELO LINK (ESCONDIDO INICIALMENTE) -->
        <div id="step2Form" style="width: 100%; display: none;">
            <p style="font-size: 13px; color: #8e8e93; text-align: center; margin-bottom: 8px;">
                Enviamos um link de confirmação para o seu e-mail.
            </p>
            <p style="font-size: 13px; color: #ffffff; text-align: center; margin-bottom: 18px;">
                Abra o e-mail e toque no link para ativar a conta.
            </p>

            <button type="button" class="btn-submit" id="btnResendEmail">REENVIAR E-MAIL</button>
        </div>

        <div>
            <a class="footer-link" onclick="window.location.href='index.html'">Já tem conta? Voltar ao Login</a>
        </div>
    </div>

    <script>
        /* ===============================================================
           1. CLIENTE SUPABASE
           =============================================================== */
        const SUPABASE_URL = 'https://aerhvhowzteqezqvhtmg.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_N0XY12nN2CAdEmI4FCGSaA__y0NNKkO';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        });

        // Página do perfil que já existe no projeto (passo 1)
        const PAGINA_PERFIL = window.location.href.replace(/[?#].*$/, '').replace(/[^/]*$/, '') + 'passo1.html';

        /* ===============================================================
           2. ELEMENTOS
           =============================================================== */
        const step1Form = document.getElementById('step1Form');
        const step2Form = document.getElementById('step2Form');
        const stepSubtitle = document.getElementById('stepSubtitle');
        const usernameField = document.getElementById('usernameField');
        const emailField = document.getElementById('emailField');
        const passwordField = document.getElementById('passwordField');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const btnGoToStep2 = document.getElementById('btnGoToStep2');
        const btnResendEmail = document.getElementById('btnResendEmail');

        /* ===============================================================
           3. ALTERNÂNCIA DO OLHO DO INSTAGRAM
           =============================================================== */
        const openEyeSVG = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
        const closedEyeSVG = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>`;

        togglePassBtn.addEventListener('click', () => {
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? closedEyeSVG : openEyeSVG;
        });

        // CONVERTE USERNAME PARA MINÚSCULAS AUTOMATICAMENTE
        usernameField.addEventListener('input', (e) => {
            e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9._]/g, '');
        });

        /* ===============================================================
           4. NAVEGAÇÃO ENTRE ETAPAS
           =============================================================== */
        function irParaConfirmacao() {
            step1Form.style.display = 'none';
            step2Form.style.display = 'block';
            stepSubtitle.innerText = 'CONFIRMAÇÃO';
        }

        /* ===============================================================
           5. ETAPA 1 -> ENVIA O LINK DE CONFIRMAÇÃO
           =============================================================== */
        btnGoToStep2.addEventListener('click', async () => {
            const username = usernameField.value.trim().replace(/^@/, '');
            const email = emailField.value.trim().toLowerCase();
            const password = passwordField.value;

            if (!username) {
                alert('Digite seu nome de usuário.');
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('Digite um e-mail válido.');
                return;
            }
            if (password.length < 6) {
                alert('A senha precisa ter no mínimo 6 caracteres.');
                return;
            }

            btnGoToStep2.disabled = true;

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { username_handle: username },
                    emailRedirectTo: PAGINA_PERFIL
                }
            });

            btnGoToStep2.disabled = false;

            if (error) {
                alert('Erro ao cadastrar: ' + error.message);
                return;
            }

            // E-mail já registado: o Supabase devolve user com identities vazio
            if (data && data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
                alert('Este e-mail já está cadastrado. Faça login ou recupere o acesso.');
                return;
            }

            // Confirmação de e-mail desativada no painel: já existe sessão
            if (data && data.session) {
                window.location.replace(PAGINA_PERFIL);
                return;
            }

            usernameField.value = username;
            irParaConfirmacao();
            alert('Enviamos um link de confirmação para ' + email + '.');
        });

        /* ===============================================================
           6. ETAPA 2 -> REENVIA O LINK DE CONFIRMAÇÃO
           =============================================================== */
        btnResendEmail.addEventListener('click', async () => {
            const email = emailField.value.trim().toLowerCase();

            if (!email) {
                alert('Digite o seu e-mail.');
                return;
            }

            btnResendEmail.disabled = true;

            const { error } = await supabaseClient.auth.resend({
                type: 'signup',
                email: email,
                options: { emailRedirectTo: PAGINA_PERFIL }
            });

            btnResendEmail.disabled = false;

            if (error) {
                alert('Não foi possível reenviar: ' + error.message);
                return;
            }

            alert('Reenviamos o link de confirmação para ' + email + '.');
        });

        /* ===============================================================
           8. AO ABRIR: PREFILL DE E-MAIL VINDO DO LOGIN
           (index.html redireciona para cá quando o e-mail não está confirmado)
           =============================================================== */
        window.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const emailParam = params.get('email');

            if (emailParam) {
                emailField.value = emailParam.toLowerCase();
            }

            if (params.get('verificar') === '1' && emailParam) {
                irParaConfirmacao();
                alert('Confirme o seu e-mail. Enviamos um novo link de confirmação.');
                return;
            }

            const { data } = await supabaseClient.auth.getSession();
            if (data && data.session) {
                window.location.replace(PAGINA_PERFIL);
            }
        });
    </script>
</body>
        </html>
