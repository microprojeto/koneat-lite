<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Topo Header Estilo Instagram */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            height: 52px;
            background: #ffffff;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: lowercase;
            color: #000000;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* Balãozinho de Mensagens com pontinha orgânica perfeita */
        .chat-bubble-icon {
            width: 22px;
            height: 22px;
            background: #8e8e93;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chat-bubble-icon::after {
            content: "";
            position: absolute;
            bottom: -1px;
            right: 2px;
            width: 5px;
            height: 5px;
            background: #8e8e93;
            border-bottom-right-radius: 3px;
            transform: rotate(15deg);
        }

        .chat-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.8px;
        }

        .chat-dot {
            width: 2.2px;
            height: 2.2px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Menu Dropdown / Folhinha dos 3 pontinhos */
        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 36px;
            background: #ffffff;
            color: #000000;
            border-radius: 16px;
            width: 190px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 1px solid rgba(0,0,0,0.08);
            z-index: 1000;
            overflow: hidden;
            padding: 6px 0;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #262626;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .dropdown-item svg {
            width: 20px;
            height: 20px;
            stroke: #262626;
        }

        /* Bloco Superior: Avatar + Métricas */
        .profile-top-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            margin-top: 4px;
        }

        .avatar-container {
            position: relative;
            width: 76px;
            height: 76px;
        }

        .avatar-circle {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #e2f0fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 24px;
            height: 24px;
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stats-bar-inline {
            display: flex;
            flex: 1;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 15px;
            font-weight: 700;
            color: #000000;
        }

        .stat-label {
            font-size: 12px;
            color: #000000;
            margin-top: 2px;
        }

        /* Bloco de Informações Dinâmicas */
        .user-details-block {
            padding: 8px 16px 0 16px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 700;
            margin: 0;
            color: #000000;
        }

        .user-tag {
            font-size: 13px;
            color: #8e8e93;
            margin: 2px 0 0 0;
        }

        .user-bio {
            font-size: 13px;
            margin: 4px 0 0 0;
            white-space: pre-wrap;
            color: #262626;
        }

        /* Botões de Ação do Perfil */
        .action-buttons {
            display: flex;
            gap: 8px;
            padding: 12px 16px 0 16px;
        }

        .btn-secondary {
            flex: 1;
            height: 36px;
            background: #eef5fb;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }

        /* Tabs de Conteúdo com a setinha deslizante fluida */
        .content-tabs-wrapper {
            position: relative;
            border-top: 1px solid #f0f0f0;
            margin-top: 16px;
        }

        .content-tabs {
            display: flex;
            position: relative;
            width: 100%;
        }

        .tab-btn {
            flex: 1;
            height: 44px;
            background: none;
            border: none;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .tab-btn.active {
            color: #000000;
            font-weight: 600;
        }

        .tabs-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            background: #000000;
            border-radius: 2px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Área Vazia / Feed Painel */
        .feed-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
        }

        .empty-icon-wrapper {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .empty-title {
            font-size: 13px;
            font-weight: 500;
            margin: 0 0 16px 0;
            color: #262626;
        }

        .btn-create-post {
            background: #eef5fb;
            color: #000000;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        /* Grid de Mídias Postadas */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px 0 80px 0;
            width: 100%;
        }

        .post-grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #efefef;
            overflow: hidden;
        }

        .post-grid-item img, .post-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-delete-post {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* BARRA DE NAVEGAÇÃO INFERIOR ORIGINAL */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #09090b;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 48px;
            height: 48px;
        }

        .nav-link svg {
            stroke: #8e8e93;
        }

        .profile-active-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .profile-active-circle svg {
            stroke: #8e8e93;
        }
    </style>
</head>

    <script src="js/app.js"></script>
    <script>
        // Lógica do indicador deslizante das abas
        const tabBtns = document.querySelectorAll('.tab-btn');
        const tabsIndicator = document.getElementById('tabsIndicator');

        function updateTabIndicator(activeTab) {
            tabsIndicator.style.width = `${activeTab.getBoundingClientRect().width}px`;
            tabsIndicator.style.left = `${activeTab.offsetLeft}px`;
        }

        window.addEventListener('load', () => {
            const currentActive = document.querySelector('.tab-btn.active');
            if (currentActive) updateTabIndicator(currentActive);
        });

        window.addEventListener('resize', () => {
            const currentActive = document.querySelector('.tab-btn.active');
            if (currentActive) updateTabIndicator(currentActive);
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                updateTabIndicator(btn);
            });
        });

        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        if (menuBtn) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('show');
            });
            window.addEventListener('click', () => {
                dropdownMenu.classList.remove('show');
            });
        }

        function renderUserPosts() {
            const userPosts = JSON.parse(localStorage.getItem('koneat_user_posts') || '[]');
            const postsGrid = document.getElementById('userPostsGrid');
            const emptyState = document.getElementById('emptyState');
            const postsCount = document.getElementById('postsCount');

            postsCount.textContent = userPosts.length;

            if (userPosts.length === 0) {
                emptyState.style.display = 'flex';
                postsGrid.style.display = 'none';
                postsGrid.innerHTML = '';
            } else {
                emptyState.style.display = 'none';
                postsGrid.style.display = 'grid';

                postsGrid.innerHTML = userPosts.map(post => {
                    const isVideo = post.type === 'video';
                    return `
                        <div class="post-grid-item" data-id="${post.id}">
                            <button type="button" class="btn-delete-post" onclick="deletePost('${post.id}')" title="Excluir publicação">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                            </button>

                            ${isVideo ? 
                                `<video src="${post.url}"></video>` 
                                : `<img src="${post.url}" alt="Post">`
                            }
                        </div>`;
                }).join('');
            }
        }

        function deletePost(postId) {
            if (!confirm('Deseja realmente excluir esta publicação?')) return;

            let userPosts = JSON.parse(localStorage.getItem('koneat_user_posts') || '[]');
            userPosts = userPosts.filter(p => p.id !== postId);
            localStorage.setItem('koneat_user_posts', JSON.stringify(userPosts));

            renderUserPosts();
        }

        renderUserPosts();
    </script>
