<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat - Perfil</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Correção para evitar corte horizontal na tela */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
            color: #262626;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Topo Header Estilo Instagram */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            height: 56px;
            background: #ffffff;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: lowercase;
            color: #000000;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #262626;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* Balãozinho de Mensagens Cinza com Rabinho */
        .chat-bubble-icon {
            width: 32px;
            height: 32px;
            background: #a8a8a8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chat-bubble-icon::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 6px;
            width: 6px;
            height: 6px;
            background: #a8a8a8;
            transform: rotate(45deg);
            border-bottom-right-radius: 2px;
        }

        .chat-dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
        }

        .chat-dot {
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* Menu Dropdown / Folhinha dos 3 pontinhos */
        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 16px;
            width: 190px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 1px solid rgba(0,0,0,0.08);
            z-index: 1000;
            overflow: hidden;
            padding: 6px 0;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #262626;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .dropdown-item svg {
            width: 20px;
            height: 20px;
            stroke: #262626;
        }

        /* Bloco Superior: Avatar + Métricas */
        .profile-top-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            margin-top: 8px;
        }

        .avatar-container {
            position: relative;
            width: 82px;
            height: 82px;
        }

        .avatar-circle {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #e2f0fd;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stats-bar-inline {
            display: flex;
            flex: 1;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 700;
            color: #000000;
        }

        .stat-label {
            font-size: 12px;
            color: #262626;
            margin-top: 2px;
        }

        /* Bloco de Informações Dinâmicas */
        .user-details-block {
            padding: 12px 16px 0 16px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
            color: #000000;
        }

        .user-tag {
            font-size: 13px;
            color: #737373;
            margin: 2px 0 0 0;
        }

        .user-bio {
            font-size: 13px;
            margin: 6px 0 0 0;
            white-space: pre-wrap;
            color: #262626;
        }

        /* Botões de Ação do Perfil (Cards Cinza Quadradinhos Igual Instagram)[span_2](start_span)[span_2](end_span) */
        .action-buttons {
            display: flex;
            gap: 8px;
            padding: 14px 16px 0 16px;
        }

        .btn-secondary {
            flex: 1;
            height: 34px;
            background: #efefef;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #dbdbdb;
        }

        /* Tabs de Conteúdo */
        .content-tabs {
            display: flex;
            border-top: 1px solid #dbdbdb;
            margin-top: 16px;
        }

        .tab-btn {
            flex: 1;
            height: 44px;
            background: none;
            border: none;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            gap: 6px;
        }

        .tab-btn.active {
            color: #000000;
            border-bottom-color: #000000;
        }

        /* Área Vazia / Feed Painel */
        .feed-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        .empty-icon-wrapper {
            width: 64px;
            height: 64px;
            border: 2px solid #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 16px 0;
            color: #000000;
        }

        .btn-create-post {
            background: #0095f6;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Grid de Mídias Postadas no Perfil */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            padding: 2px 0 80px 0;
            width: 100%;
        }

        .post-grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #efefef;
            overflow: hidden;
        }

        .post-grid-item img, .post-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .post-grid-item .badge-video {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            padding: 3px;
            border-radius: 4px;
            display: flex;
            z-index: 2;
        }

        /* Botão de Lixeira (🗑️) Discreto no Canto do Card */
        .btn-delete-post {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: background 0.2s, transform 0.15s;
        }

        .btn-delete-post:hover {
            background: rgba(231, 76, 60, 0.9);
        }

        .btn-delete-post:active {
            transform: scale(0.9);
        }

        /* Barra de Navegação Inferior Fixa de Ponta a Ponta */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #121214;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 48px;
            height: 48px;
        }

        /* Estado do Ícone de Perfil Ativo (Círculo Oco / Borda Branca) */
        .profile-active-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .profile-active-circle svg {
            stroke: #8e8e93;
        }
    </style>
</head>
