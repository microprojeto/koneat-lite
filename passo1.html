<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat - Perfil</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* TOPO DO PERFIL ESTILO INSTAGRAM */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            height: 56px;
        }

        .header-logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: lowercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        /* BALÃOZINHO DE MENSAGENS REDONDO COM 3 PONTINHOS EM PÉ E RABINHO */
        .chat-bubble-icon {
            width: 32px;
            height: 32px;
            background: #262626;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chat-bubble-icon::after {
            content: "";
            position: absolute;
            bottom: -3px;
            left: 6px;
            width: 6px;
            height: 6px;
            background: #262626;
            transform: rotate(45deg);
            border-bottom-right-radius: 2px;
        }

        .chat-dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5px;
        }

        .chat-dot {
            width: 3px;
            height: 3px;
            background: #ffffff;
            border-radius: 50%;
        }

        /* MENU DROPDOWN ESTILO FLUTUANTE BRANCO COM ÍCONES */
        .dropdown-wrapper {
            position: relative;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 40px;
            background: #ffffff;
            color: #000000;
            border-radius: 16px;
            width: 190px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow: hidden;
            padding: 6px 0;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #262626;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .dropdown-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .dropdown-item svg {
            width: 20px;
            height: 20px;
            stroke: #262626;
        }

        /* BLOCO SUPERIOR: AVATAR + MÉTRICAS */
        .profile-top-layout {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            margin-top: 8px;
        }

        .avatar-container {
            position: relative;
            width: 82px;
            height: 82px;
        }

        .avatar-circle {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: #1c1c1e;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .camera-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 26px;
            height: 26px;
            background: #0095f6;
            border: 2px solid #000000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stats-bar-inline {
            display: flex;
            flex: 1;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-number {
            font-size: 16px;
            font-weight: 700;
        }

        .stat-label {
            font-size: 12px;
            color: #8e8e93;
            margin-top: 2px;
        }

        /* INFORMAÇÕES DINÂMICAS */
        .user-details-block {
            padding: 12px 16px 0 16px;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
            margin: 0;
        }

        .user-tag {
            font-size: 13px;
            color: #8e8e93;
            margin: 2px 0 0 0;
        }

        .user-bio {
            font-size: 13px;
            margin: 6px 0 0 0;
            white-space: pre-wrap;
        }

        /* BOTÕES DE AÇÃO */
        .action-buttons {
            display: flex;
            gap: 8px;
            padding: 14px 16px 0 16px;
        }

        .btn-action-profile {
            flex: 1;
            height: 34px;
            background: #262626;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action-profile:hover {
            background: #363636;
        }

        /* TABS DE CONTEÚDO */
        .content-tabs {
            display: flex;
            border-top: 1px solid #262626;
            margin-top: 16px;
        }

        .tab-btn {
            flex: 1;
            height: 44px;
            background: none;
            border: none;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-bottom: 1px solid transparent;
        }

        .tab-btn.active {
            color: #ffffff;
            border-bottom-color: #ffffff;
        }

        /* ESTADO VAZIO DO FEED */
        .feed-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            text-align: center;
        }

        .empty-icon-wrapper {
            width: 64px;
            height: 64px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0 0 16px 0;
        }

        .btn-create-post {
            background: #0095f6;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* GRID DE POSTS */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px;
            width: 100%;
        }

        .post-grid-item {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #1c1c1e;
            overflow: hidden;
        }

        .post-grid-item img, .post-grid-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-video {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            padding: 3px;
            border-radius: 4px;
            display: flex;
        }

        .btn-delete-post {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ffffff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        /* BARRA DE NAVEGAÇÃO INFERIOR FIXA */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #121214;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            padding: 0 10px;
        }

        .nav-link {
            background: none;
            border: none;
            cursor: pointer;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            width: 48px;
            height: 48px;
        }

        /* CÍRCULO OCO BRANCO PARA PERFIL ATIVO */
        .profile-active-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-active-circle svg {
            stroke: #ffffff;
        }
    </style>
</head>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        if (menuBtn) {
            menuBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dropdownMenu.classList.toggle('show');
            });
            window.addEventListener('click', () => {
                dropdownMenu.classList.remove('show');
            });
        }

        function renderUserPosts() {
            const userPosts = JSON.parse(localStorage.getItem('koneat_user_posts') || '[]');
            const postsGrid = document.getElementById('userPostsGrid');
            const emptyState = document.getElementById('emptyState');
            const postsCount = document.getElementById('postsCount');

            postsCount.textContent = userPosts.length;
