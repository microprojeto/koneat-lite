<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Koneat Lite - Login</title>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* CONTAINER PRINCIPAL DO LOGIN (390x844px Max, Tela Cheia sem Scroll) */
        .app-screen {
            width: 100%;
            max-width: 390px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px) 24px;
            position: relative;
        }

        /* TOPO: LOGO E TÍTULOS */
        .logo-area {
            text-align: center;
            margin-top: 16px;
        }

        .logo-text {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            line-height: 1;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 4px 0 0 0;
        }

        .brand-name span {
            font-weight: 300;
            color: #8e8e93;
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            color: #8e8e93;
            margin-top: 4px;
            text-transform: uppercase;
        }

        /* FORMULÁRIO E CAMPOS TIPO PÍLULA */
        .form-container {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-label {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
        }

        .input-wrapper:focus-within {
            border-color: #ffffff;
        }

        .input-field {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
        }

        .input-field::placeholder {
            color: #8e8e93;
        }

        /* BOTÃO DE OLHO ESTILO INSTAGRAM (SÓ NO CAMPO SENHA) */
        .toggle-password {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8e8e93;
            transition: color 0.2s ease;
        }

        .toggle-password:hover, .toggle-password:active {
            color: #ffffff;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
        }

        /* BOTÃO ENTRAR PÍLULA BRANCA */
        .btn-submit {
            width: 100%;
            height: 48px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-top: 8px;
        }

        /* DIVISOR OU */
        .divider-container {
            width: 100%;
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e93;
            font-size: 13px;
        }

        .divider-container::before,
        .divider-container::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.12);
        }

        .divider-container span {
            padding: 0 12px;
        }

        /* BOTÃO GOOGLE COM DIVISÓRIA VERTICAL */
        .btn-google {
            width: 100%;
            height: 48px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }

        .google-icon-wrapper {
            display: flex;
            align-items: center;
            padding-right: 12px;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            margin-right: 12px;
        }

        /* RODAPÉ EM CINZA FOSCO COM SUBLINHADO */
        .footer-links {
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .footer-link {
            color: #8e8e93;
            text-decoration: underline;
            text-underline-offset: 4px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .footer-link:active, .footer-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <!-- TOPO -->
        <div class="logo-area">
            <h1 class="logo-text">K.</h1>
            <h2 class="brand-name">KONEΛT <span>LITE</span></h2>
            <p class="subtitle">O COMEÇO</p>
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <div class="form-container">
            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label" for="emailField">E-mail</label>
                    <div class="input-wrapper">
                        <input type="email" id="emailField" class="input-field" placeholder="Digite seu e-mail." required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" for="passwordField">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="passwordField" class="input-field" placeholder="Digite sua senha." required autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassBtn" aria-label="Alternar senha">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    ENTRAR 
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </form>

            <div class="divider-container">
                <span>Ou</span>
            </div>

            <button type="button" class="btn-google" id="btnGoogle">
                <div class="google-icon-wrapper">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.36 7.25 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.1 0 9.81 0 12s.43 3.9 1.19 5.42l4.09-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.25 0 3.17 2.64 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                </div>
                Entrar com Google
            </button>
        </div>

        <!-- RODAPÉ COMPACTO CINZA -->
        <div class="footer-links">
            <a id="btnSignUp" class="footer-link">Criar nova conta</a>
            <a id="btnForgot" class="footer-link">Recuperar acesso</a>
        </div>
    </div>

    <script>
        // 1. CONFIGURAÇÃO COM AS SUAS CHAVES REAIS DO SUPABASE
        const SUPABASE_URL = 'https://dqazufjeldpodhdgvcpt.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_tWV7CzBUNVZJIQi-o24DyQ_H-qzGC4A';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. ALTERNÂNCIA DO OLHO DO INSTAGRAM
        const passwordField = document.getElementById('passwordField');
        const togglePassBtn = document.getElementById('togglePassBtn');
        const eyeIcon = document.getElementById('eyeIcon');

        const openEyeSVG = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
        const closedEyeSVG = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2z"/>`;

        togglePassBtn.addEventListener('click', () => {
            const isPassword = passwordField.getAttribute('type') === 'password';
            passwordField.setAttribute('type', isPassword ? 'text' : 'password');
            eyeIcon.innerHTML = isPassword ? closedEyeSVG : openEyeSVG;
        });

        // 3. AUTO REDIRECIONAR SE JÁ ESTIVER LOGADO
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'perfil.html';
            }
        });

        // 4. SUBMIT DO FORMULÁRIO DE LOGIN
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('emailField').value.trim().toLowerCase();
            const password = passwordField.value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                alert('Erro ao entrar: ' + error.message);
            } else {
                window.location.href = 'perfil.html';
            }
        });

        // 5. LOGIN COM GOOGLE
        document.getElementById('btnGoogle').addEventListener('click', async () => {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/perfil.html'
                }
            });
            if (error) alert('Erro com Google: ' + error.message);
        });

        // 6. LINKS DO RODAPÉ
        document.getElementById('btnSignUp').addEventListener('click', () => {
            window.location.href = 'cadastro.html';
        });

        document.getElementById('btnForgot').addEventListener('click', () => {
            window.location.href = 'recuperar.html';
        });
    </script>
</body>
</html>
